<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucas Andrey Maurício | Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,600;1,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--blue:#0a35d6;--cyan:#5be2ff;--ink:#020a3a;--yellow:#fff;--pink:#ff5aa5;--red:#e8001c;--sw:clamp(64px,15vw,230px);--ease:cubic-bezier(.2,.9,.2,1);
--cut:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:#fff;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.2rem;font-weight:600;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.display{text-transform:uppercase;letter-spacing:-.02em;font-weight:800;font-style:italic}
.cut{clip-path:var(--cut)}

/* Fundo */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#19b9ff 0%,#0b7cf4 22%,#0a43e2 52%,#0826b8 100%)}
#bg .w{position:absolute;inset:-6% -6% 50% -6%;filter:blur(5px);background:radial-gradient(ellipse 22% 26% at 22% 30%,rgba(255,255,255,.4),transparent),radial-gradient(ellipse 30% 22% at 62% 18%,rgba(255,255,255,.34),transparent),radial-gradient(ellipse 18% 30% at 90% 50%,rgba(255,255,255,.26),transparent);animation:sway 10s ease-in-out infinite alternate}
@keyframes sway{to{transform:translate(-3%,3%) scale(1.06)}}
#bg .r{position:absolute;top:0;right:6%;width:28%;bottom:25%;opacity:.55;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 5px,transparent 5px 16px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}
#bg .v{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 55%,transparent 35%,rgba(2,10,100,.55))}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;mix-blend-mode:soft-light;transition:opacity 1.2s}
#bg img.on{opacity:.75}
#app{position:fixed;inset:0;z-index:2}
#side{position:absolute;left:0;top:0;bottom:0;width:var(--sw);z-index:5;pointer-events:none;background:#fff;clip-path:polygon(0 0,100% 0,70% 100%,0 100%);overflow:hidden}
#ghost{position:absolute;left:6%;top:1%;writing-mode:vertical-rl;font-size:min(17vh,calc(var(--sw)*.85));line-height:.9;color:#000;white-space:nowrap}
#ghost::before{content:attr(data-t);position:absolute;left:-.55em;top:-.4em;color:#8c8c8c;z-index:-1}

/* Cortina de entrada */
#curtain{position:fixed;top:0;bottom:0;left:-12vw;right:-12vw;z-index:100;pointer-events:none;display:flex}
#curtain i{flex:1;margin:0 -2.5vw;background:var(--c);transform:skewX(-14deg);animation:wipe .75s var(--ease) forwards;animation-delay:calc(var(--i)*.09s + .4s)}
@keyframes wipe{to{transform:skewX(-14deg) translateY(-115%)}}

/* Glitch */
#glitch{position:fixed;inset:0;z-index:90;pointer-events:none;display:none;overflow:hidden}
#glitch.on{display:block}
#glitch::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(#000 0 25%,transparent 0 50%) 0 0/18px 18px;opacity:.22;animation:blink .5s steps(4)}
#glitch b{position:absolute;left:0;width:100%;background:var(--c);mix-blend-mode:screen;animation:slice .5s steps(6) forwards}
@keyframes slice{0%{transform:translateX(-100%)}35%{transform:translateX(7%)}65%{transform:translateX(-5%)}100%{transform:translateX(110%)}}
@keyframes blink{0%,100%{opacity:.22}50%{opacity:0}}
.glitching #app{animation:jit .5s steps(5)}
@keyframes jit{0%,100%{filter:none;transform:none}20%{filter:hue-rotate(90deg) contrast(1.6);transform:translate(-7px,2px) skewX(3deg)}40%{filter:saturate(3);transform:translate(9px,-3px)}60%{filter:hue-rotate(-60deg);transform:translate(-3px,0) skewX(-4deg)}80%{filter:contrast(2) brightness(1.4);transform:translate(4px,1px)}}

/* Menu principal */
#menuScreen{position:absolute;inset:0;display:flex;align-items:center;padding-left:var(--sw)}
#menuScreen.off{display:none}
.menu-col{margin-left:clamp(1rem,16vw,22vw);width:min(560px,80vw);padding:3rem 0}
#menu{position:relative;transform:rotate(-13deg);transform-origin:20% 50%}
#cursor{position:absolute;left:0;top:0;z-index:1;pointer-events:none;transition:transform .32s cubic-bezier(.3,1.4,.5,1),width .32s var(--ease),height .32s var(--ease);filter:drop-shadow(0 0 14px rgba(255,90,165,.8))}
#cursor::before,#cursor::after{content:"";position:absolute;inset:0;clip-path:polygon(0 14%,100% 0,98% 86%,1% 100%)}
#cursor::before{background:var(--pink);transform:translate(14px,-9px)}
#cursor::after{background:#fff}
.item{position:relative;z-index:2;display:block;width:fit-content;margin:0 0 -.2rem;padding:.3rem .5rem;border:0;background:none;cursor:pointer;text-align:left}
.item .label{display:inline-block;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:.85;letter-spacing:-.045em;color:var(--cyan);transform-origin:left center;transition:transform .3s var(--ease),color .15s}
.item:hover .label{color:#d4f8ff}
.item.sel{z-index:3}
.item.sel .label{transform:scale(1.32) translateX(.15em);background:linear-gradient(174deg,var(--red) 0 54%,#000 54%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ready .item{animation:slideIn .6s var(--ease) both;animation-delay:calc(var(--i)*.08s)}
@keyframes slideIn{from{opacity:0;translate:-120% 0}to{opacity:1;translate:0 0}}
#info{position:fixed;z-index:6;left:calc(var(--sw)*.9);top:clamp(1rem,6vh,3.5rem);background:#fff;color:#000;border:2px solid #000;outline:2px solid #fff;padding:.6rem 1.2rem .5rem;min-width:220px}
#info h1{margin:0;font-size:2.1rem;line-height:1;font-weight:600;font-style:italic;letter-spacing:-.03em}
#info p{margin:.2rem 0 0;font-size:.85rem;font-weight:800;font-style:italic}
#cmd{position:fixed;right:clamp(1rem,3vw,3rem);bottom:clamp(1rem,4vh,2.5rem);width:min(380px,72vw)}
#cmdTitle{font-size:clamp(1.8rem,3vw,2.3rem);font-style:italic;font-weight:600;line-height:1;letter-spacing:-.03em}
#cmdTitle.swap{animation:pv .3s var(--ease) both}
@keyframes pv{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.cl{display:flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:800;font-style:italic;margin:.2rem 0 .7rem}
.cl::after{content:"";flex:1;height:1px;background:#fff}
.cb{display:inline-flex;align-items:center;gap:.4rem;border:0;background:none;cursor:pointer;font-size:1.5rem;font-style:italic;font-weight:600;letter-spacing:-.03em}
.cb b{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border:2px solid #fff;border-radius:50%;font-size:1rem;font-style:normal;transition:background .15s,color .15s}
.cb:hover b{background:#fff;color:var(--blue)}

/* Painéis */
.panel{position:absolute;inset:0;display:none;padding:clamp(1rem,3.5vw,3rem) clamp(1rem,3.5vw,3rem) clamp(1rem,3.5vw,3rem) calc(var(--sw) + 1.5rem);overflow:auto;background:rgba(4,22,140,.5)}
.panel.active{display:block;animation:panelIn .55s var(--ease) both}
@keyframes panelIn{from{clip-path:polygon(0 0,0 0,-15% 100%,0 100%)}to{clip-path:polygon(0 0,115% 0,100% 100%,-15% 100%)}}
.phead{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.6rem;flex-wrap:wrap}
.phead h2{margin:0;font-size:clamp(2.4rem,6vw,4rem);line-height:1}
.back{border:0;cursor:pointer;background:var(--pink);padding:.55rem 1.3rem;font-weight:600;clip-path:polygon(0 0,100% 0,90% 100%,0 100%);transition:background .15s,padding .2s}
.back:hover{background:var(--yellow);color:var(--ink);padding-right:2rem}
.box{background:linear-gradient(135deg,rgba(2,12,80,.84),rgba(3,20,120,.92));padding:1.6rem;clip-path:var(--cut);border-left:4px solid var(--cyan)}
.bar{height:11px;background:#0a1440;clip-path:polygon(0 0,100% 0,98% 100%,0 100%)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 12px var(--cyan);transition:width 1.1s var(--ease) var(--d,0s)}
.bar.sp i{background:linear-gradient(90deg,var(--pink),#ff7aa5);box-shadow:0 0 12px var(--pink)}
.filled .bar i{width:var(--v)}
.pips{display:flex;gap:4px}
.pip{width:18px;height:12px;background:#0a1440;transform:skewX(-20deg);transition:background .2s calc(var(--k)*.07s)}
.filled .pip.on{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.lv{font-size:3.4rem;line-height:1;color:var(--yellow)}

/* Skills */
.skill{display:grid;grid-template-columns:44px 1fr auto;gap:.2rem .8rem;align-items:center;margin-bottom:1rem}
.ico{grid-row:span 2;width:44px;height:44px;display:grid;place-items:center;background:var(--blue);font-weight:600;font-size:.8rem;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:background .2s}
.skill:hover .ico{background:var(--pink)}
.skill .bar{grid-column:2/4}

/* Projetos */
.card{position:relative;text-align:left;border:0;cursor:pointer;padding:1.4rem 1.4rem 1.6rem;background:rgba(0,16,70,.9);clip-path:var(--cut);overflow:hidden;transition:transform .25s var(--ease),background .15s}
.card::before{content:"";position:absolute;left:0;bottom:0;height:6px;width:18%;background:var(--pink);box-shadow:0 0 14px var(--pink);transition:width .35s var(--ease),background .2s}
.card:hover,.card:focus-visible{background:var(--blue);transform:translateY(-6px) scale(1.02)}
.card:hover::before,.card:focus-visible::before{width:100%;background:var(--yellow)}
.card h3{margin:.2rem 0 .5rem;font-size:2rem;line-height:1}
.tag{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:600;font-size:.75rem;padding:.1rem .6rem;clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
.chip{display:inline-block;border:1px solid var(--cyan);color:var(--cyan);padding:.1rem .6rem;margin:.2rem .3rem 0 0;font-size:.8rem}
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(2,3,10,.85);padding:1rem}
.modal.open{display:grid}
.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:linear-gradient(135deg,var(--blue),#001040 70%);padding:2rem}
.modal.open .modal-box{animation:pop .45s var(--ease) both}
@keyframes pop{from{clip-path:polygon(50% 0,50% 0,50% 0,50% 100%,50% 100%,50% 100%)}to{clip-path:var(--cut)}}
.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;font-weight:600;padding:.7rem 1.6rem;margin:1rem .6rem 0 0;background:#fff;color:var(--blue);clip-path:polygon(0 0,100% 0,92% 100%,0 100%);transition:background .15s,color .15s,filter .15s}
.btn:hover{background:var(--yellow);color:var(--ink);filter:drop-shadow(0 0 8px var(--yellow))}
.btn.alt{background:var(--pink);color:#fff}

/* Contato */
.link{display:flex;justify-content:space-between;gap:1rem;padding:1rem 1.4rem;margin-bottom:.6rem;text-decoration:none;color:#fff;background:rgba(0,16,70,.9);clip-path:polygon(0 0,100% 0,96% 100%,0 100%);transition:padding-left .25s var(--ease),background .15s}
.link:hover{background:var(--blue);padding-left:2.2rem}
.field{width:100%;background:rgba(0,16,70,.9);border:0;border-bottom:3px solid var(--cyan);padding:.8rem 1rem;margin-bottom:.8rem}
.field:focus{outline:none;border-color:var(--yellow);background:rgba(0,68,255,.35)}

@media(min-width:900px){.phead h2{display:none}}
@media(max-width:899px){
.menu-col{margin-left:0;padding:4.5rem 0 5.5rem}
#info{left:calc(var(--sw) + .6rem);top:.8rem;min-width:0;padding:.35rem .8rem}
#info h1{font-size:1.3rem}#info p{font-size:.75rem}
#cmd{left:calc(var(--sw) + .8rem);right:.8rem;bottom:.8rem;width:auto}
#cmdTitle{font-size:1.5rem}.cb{font-size:1.25rem}
.panel{padding:1rem .8rem 2rem calc(var(--sw) + .8rem)}
.modal-box{padding:1.4rem}
}
@media(max-height:480px){#cmd{display:none}.menu-col{padding:1rem 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="bg"><div class="w"></div><div class="r"></div><img alt="" aria-hidden="true"><img alt="" aria-hidden="true"><div class="v"></div></div>

<div id="app">

    <div id="info"><h1 id="brandName"></h1><p id="brandRole"></p></div>

    <div id="cmd"><div id="cmdTitle"></div><div class="cl">Comandos</div><button class="cb" id="btnA" type="button"><b>A</b>Confirmar</button></div>
  </main>

  <section id="status" class="panel" aria-label="Status">
    <header class="phead"><button class="back" data-back>Voltar (Esc)</button><h2 class="display">Status</h2></header>

    <header class="phead"><button class="back" data-back>Voltar (Esc)</button><h2 class="display">Contact</h2></header>

      <div id="links"></div>
      <form id="form" autocomplete="off">
        <label class="sr-only" for="fName">Seu nome</label><input class="field" id="fName" placeholder="Seu nome" required>
        <label class="sr-only" for="fMsg">Mensagem</label><textarea class="field" id="fMsg" rows="5" placeholder="Escreva sua mensagem" required></textarea>
        <button class="btn" type="submit" style="margin-top:.2rem">Enviar mensagem</button>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal-box cut">
    <span class="tag" id="mTag"></span>
    <h3 class="display" id="mTitle" style="font-size:2.6rem;margin:.4rem 0"></h3>
    <p id="mDesc" style="line-height:1.6"></p>
    <div id="mStack"></div>
    <div><a class="btn" id="mGit" target="_blank" rel="noopener">GitHub</a><a class="btn alt" id="mDemo" target="_blank" rel="noopener">Demo</a><button class="btn" id="mClose" type="button">Fechar</button></div>
  </div>
</div>

<div id="glitch" aria-hidden="true"></div>
<div id="curtain" aria-hidden="true"></div>

<script>
/* ===== EDITE AQUI: todos os seus dados ficam neste objeto ===== */
const DATA={
  name:'Lucas Andrey Maurício', role:'Full-Stack Developer', level:19,
  bio:'Desenvolvo interfaces e sistemas web do design ao deploy. Gosto de produto bem acabado, código legível e detalhes de interação que dão personalidade.',
  stats:[['Lógica',8],['Criatividade',9],['Comunicação',7],['Foco',8]],
  menu:[
    {id:'status',label:'STATUS',sub:'Sobre mim',desc:'Veja minha ficha'},
    {id:'skills',label:'SKILLS',sub:'Tech stack',desc:'Confira minhas habilidades'},
    {id:'projects',label:'PROJECTS',sub:'Trabalhos',desc:'Abra um dos meus projetos'},
    {id:'contact',label:'CONTACT',sub:'Redes',desc:'Mande uma mensagem'}
  ],
  skills:{
    'Linguagens':[['C+','C++',60],['JA','Java',65],['JS','JavaScript',75],['PH','PHP',70],['PY','Python',65]],
    'Web':[['H5','HTML5',85],['CS','CSS',80],['HS','HTML semântico',80],['BO','Bootstrap',75],['W3','W3Schools',70]],
    'Dados e ferramentas':[['My','MySQL',70],['SQ','SQL',70],['GI','Git',75],['GH','GitHub',75],['VS','VS Code',85]]
  },
  projects:[
    {t:'FitFATEC',tag:'IA generativa',d:'Projeto de IA generativa desenvolvido na FATEC, com foco em academia e treino.',s:['IA generativa'],git:'https://github.com/izumilg/FitFATEC',demo:''},
    {t:'Sistema LuModas',tag:'Sistema web',d:'Sistema para a empresa LuModas, desenvolvido pelo grupo DevTools no segundo semestre de DSM da Fatec Zona Sul.',s:['PHP','JavaScript','CSS','SQL'],git:'https://github.com/SistemaLuModas/SistemaLuModas-DSM',demo:''},
    {t:'Frieren Jornada',tag:'Site de fã',d:'Site de fã de Frieren em uma única página, com contador animado, abas do grupo, linha do tempo e pétalas desenhadas em canvas.',s:['HTML','CSS','JavaScript'],git:'https://github.com/izumilg/frieren-jornada',demo:'https://izumilg.github.io/frieren-jornada/'}
  ],
  links:[['GitHub','github.com/izumilg','https://github.com/izumilg'],['LinkedIn','Lucas Andrey Maurício','https://www.linkedin.com/in/lucas-andrey-maur%C3%ADcio/'],['E-mail','lucasandreymauricio@gmail.com','mailto:lucasandreymauricio@gmail.com']],
  email:'lucasandreymauricio@gmail.com',
  // GIFs de fundo: adicione quantos links quiser. Com mais de um, eles se alternam com fade.
  bgs:['https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExa2owdDUyZGhqOW42MGN2eHYzYjd4bGQwNmhoMmZqMGcxMnZzb3pyeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/v7FDuR0rh63Qjwci0o/giphy.gif']
};

/* ===== Lógica ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let sel=0, view='menu', busy=false, lastFocus=null;
const menuEl=$('#menu'), cursor=$('#cursor');

// Render
$('#brandName').textContent=DATA.name;$('#brandRole').textContent=DATA.role;
document.title=`${DATA.name} | Portfólio`;
DATA.menu.forEach((m,i)=>{
  const b=document.createElement('button');
  b.className='item';b.style.setProperty('--i',i);b.dataset.id=m.id;
  b.innerHTML=`<span class="label display">${m.label}</span>`;
  menuEl.appendChild(b);
});
const items=$$('.item');

$('#lvTag').textContent='LV '+DATA.level;
$('#stName').textContent=DATA.name;$('#stClass').textContent=DATA.role;$('#stBio').textContent=DATA.bio;
$('#stats').innerHTML=DATA.stats.map(([n,v])=>`<div><div class="text-sm mb-1">${n}</div><div class="pips">${Array.from({length:10},(_,k)=>`<span class="pip${k<v?' on':''}" style="--k:${k}"></span>`).join('')}</div></div>`).join('');

$('#skillGrid').innerHTML=Object.entries(DATA.skills).map(([cat,list])=>`<div class="box"><h3 class="display" style="font-size:1.8rem;margin:0 0 1rem;color:var(--yellow)">${cat}</h3>${list.map(([ic,n,v],k)=>`<div class="skill"><div class="ico">${ic}</div><span>${n}</span><span class="text-sm">${v}%</span><div class="bar"><i style="--v:${v}%;--d:${k*.12}s"></i></div></div>`).join('')}</div>`).join('');

$('#projGrid').innerHTML=DATA.projects.map((p,i)=>`<button class="card" data-p="${i}"><span class="tag">${p.tag}</span><h3 class="display">${p.t}</h3><span style="opacity:.8;line-height:1.5">${p.d}</span></button>`).join('');

$('#links').innerHTML=DATA.links.map(([n,t,h])=>`<a class="link" href="${h}" target="_blank" rel="noopener"><strong>${n}</strong><span>${t}</span></a>`).join('');

// Seleção do menu
function moveCursor(){
  const it=items[sel],l=it.firstElementChild,w=l.offsetWidth*1.32+60,h=it.offsetHeight*1.3;
  cursor.style.cssText=`width:${w}px;height:${h}px;transform:translate(${it.offsetLeft-30}px,${it.offsetTop-(h-it.offsetHeight)/2}px)`;
}
function select(i){
  sel=(i+items.length)%items.length;
  items.forEach((el,k)=>el.classList.toggle('sel',k===sel));
  moveCursor();
  const t=$('#cmdTitle');t.textContent=DATA.menu[sel].desc;t.classList.remove('swap');void t.offsetWidth;t.classList.add('swap');
}
items.forEach((el,i)=>{
  el.addEventListener('pointerenter',()=>{if(view==='menu'&&!busy)select(i)});
  el.addEventListener('focus',()=>{if(view==='menu')select(i)});
  el.addEventListener('click',()=>go(el.dataset.id));
});
addEventListener('resize',moveCursor);document.fonts&&document.fonts.ready.then(moveCursor);$('#btnA').addEventListener('click',()=>go(DATA.menu[sel].id));

// Transição com glitch
function slices(){
  const g=$('#glitch'),cols=['#00aaff','#ff2a6d','#fff','#0044ff','#ffe600'];
  g.innerHTML='';
  for(let i=0;i<10;i++){
    const b=document.createElement('b');
    b.style.cssText=`top:${Math.random()*92}%;height:${3+Math.random()*12}%;--c:${cols[i%5]};animation-delay:${(Math.random()*.15).toFixed(2)}s`;
    g.appendChild(b);
  }
  g.classList.add('on');
}
function swap(id){
  $$('.panel').forEach(p=>p.classList.remove('active','filled'));
  $('#menuScreen').classList.toggle('off',id!=='menu');
  const g=$('#ghost');g.textContent=g.dataset.t=id==='menu'?'PRINCIPAL':id.toUpperCase();
  view=id;
  if(id==='menu'){moveCursor();items[sel].focus({preventScroll:true});return}
  const p=document.getElementById(id);
  p.classList.add('active');p.scrollTop=0;
  setTimeout(()=>p.classList.add('filled'),reduce?0:220);
  $('[data-back]',p).focus({preventScroll:true});
}
function go(id){
  if(busy||id===view)return;
  busy=true;
  if(reduce){swap(id);busy=false;return}
  slices();document.body.classList.add('glitching');
  setTimeout(()=>swap(id),260);
  setTimeout(()=>{document.body.classList.remove('glitching');$('#glitch').classList.remove('on');busy=false},580);
}
$$('[data-back]').forEach(b=>b.addEventListener('click',()=>go('menu')));

// Modal de projetos
const modal=$('#modal');
function openModal(i){
  const p=DATA.projects[i];lastFocus=document.activeElement;
  $('#mTag').textContent=p.tag;$('#mTitle').textContent=p.t;$('#mDesc').textContent=p.d;
  $('#mStack').innerHTML=p.s.map(s=>`<span class="chip" style="color:#fff;border-color:#fff">${s}</span>`).join('');
  $('#mGit').href=p.git;const dm=$('#mDemo');dm.style.display=p.demo?'':'none';if(p.demo)dm.href=p.demo;
  modal.classList.add('open');$('#mClose').focus();
}
function closeModal(){modal.classList.remove('open');lastFocus&&lastFocus.focus()}
$$('.card').forEach(c=>c.addEventListener('click',()=>openModal(+c.dataset.p)));
$('#mClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

// Contato (abre o app de e-mail)
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const n=$('#fName').value,m=$('#fMsg').value;
  location.href=`mailto:${DATA.email}?subject=${encodeURIComponent('Contato pelo portfólio: '+n)}&body=${encodeURIComponent(m)}`;
});

// Teclado
addEventListener('keydown',e=>{
  if(modal.classList.contains('open')){if(e.key==='Escape')closeModal();return}
  if(view==='menu'){
    if(['ArrowUp','w','W'].includes(e.key)){e.preventDefault();select(sel-1)}
    else if(['ArrowDown','s','S'].includes(e.key)){e.preventDefault();select(sel+1)}
    else if(e.key==='Enter'){e.preventDefault();go(DATA.menu[sel].id)}
    else if(/^[1-4]$/.test(e.key)){select(+e.key-1);go(DATA.menu[sel].id)}
  }else if(e.key==='Escape'){go('menu')}
});

// GIFs de fundo (DATA.bgs)
(function bgGifs(){
  const imgs=$$('#bg img'),list=DATA.bgs||[];
  if(!list.length||reduce)return;
  let i=0,k=0;
  const show=()=>{
    const el=imgs[k%2];k++;
    el.onload=()=>{imgs.forEach(x=>x.classList.remove('on'));el.classList.add('on')};
    el.onerror=()=>el.removeAttribute('src');
    el.src=list[i%list.length];i++;
  };
  show();
  if(list.length>1)setInterval(show,9000);
})();

// Entrada: cortina geométrica e depois o menu
(function intro(){
  const c=$('#curtain'),cols=['#0044ff','#02030a','#ff2a6d','#fff','#00aaff','#0044ff'];
  const done=()=>{c.remove();$('#menuCol').classList.add('ready');select(0);items[0].focus({preventScroll:true})};
  if(reduce){done();return}
  cols.forEach((col,i)=>{const s=document.createElement('i');s.style.setProperty('--c',col);s.style.setProperty('--i',i);c.appendChild(s)});
  select(0);
  c.lastChild.addEventListener('animationend',done);
  setTimeout(()=>{if(document.body.contains(c))done()},2400);
})();
</script>
